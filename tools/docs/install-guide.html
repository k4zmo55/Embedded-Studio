<!doctype html>
<!-- README kurulum animasyonu için temsili VS Code çizimi. tools/docs/make-docs.py her kareyi #adim=..&yaz=.. ile render eder. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#1f1f1f; --side:#181818; --act:#181818; --bar:#007acc; --fg:#cccccc; --muted:#8b8b8b; --border:#2b2b2b; --input:#313131; --btn:#0078d4; --sel:#04395e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 960px; height: 560px; overflow: hidden; background: #0d1117; font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; color: var(--fg); }
  .win { position: absolute; left: 0; top: 0; width: 960px; height: 500px; background: var(--bg); display: grid; grid-template-rows: 30px 1fr 22px; }
  .title { background: #181818; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; position: relative; }
  .dots { position: absolute; left: 12px; display: flex; gap: 7px; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .main { display: grid; grid-template-columns: 48px 300px 1fr; min-height: 0; }
  .activity { background: var(--act); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding-top: 8px; gap: 6px; }
  .ab { width: 48px; height: 44px; display: grid; place-items: center; color: #858585; position: relative; }
  .ab.on { color: #fff; }
  .ab.on::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; background: #fff; }
  .ab.pulse::after { content: ''; position: absolute; inset: 4px; border: 2px solid #f5a524; border-radius: 8px; }
  .sidebar { background: var(--side); border-right: 1px solid var(--border); padding: 10px 12px; min-width: 0; }
  .sb-title { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .search { background: var(--input); border: 1px solid #3c3c3c; border-radius: 2px; height: 26px; display: flex; align-items: center; padding: 0 8px; color: #fff; }
  .search.focus { border-color: #0078d4; }
  .caret { display: inline-block; width: 1px; height: 14px; background: #fff; margin-left: 1px; }
  .ext { display: grid; grid-template-columns: 42px 1fr; gap: 10px; padding: 10px 6px; margin-top: 10px; border-radius: 4px; }
  .ext.sel { background: var(--sel); }
  .ext img { width: 42px; height: 42px; border-radius: 6px; }
  .ext b { color: #fff; font-size: 13px; }
  .ext .pub { color: var(--muted); font-size: 12px; }
  .ext .desc { color: #bbb; font-size: 12px; margin: 3px 0 6px; line-height: 1.35; }
  .install { background: var(--btn); color: #fff; border-radius: 2px; padding: 2px 9px; font-size: 12px; display: inline-block; position: relative; }
  .install.done { background: transparent; color: var(--muted); border: 1px solid #3c3c3c; }
  .install.pulse { box-shadow: 0 0 0 3px #f5a524; }
  .badge { background: #6b5b00; color: #ffd866; border-radius: 3px; padding: 0 5px; font-size: 10px; margin-left: 6px; }
  .editor { position: relative; display: grid; place-items: center; color: #555; overflow: hidden; }
  .editor .logo { font-size: 72px; opacity: .12; }
  .editor img.shot { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); object-fit: cover; object-position: top center; border: 1px solid var(--border); border-radius: 4px; }
  .status { background: var(--bar); color: #fff; font-size: 12px; display: flex; align-items: center; padding: 0 10px; gap: 16px; }
  .status .es { display: flex; align-items: center; gap: 5px; padding: 0 6px; height: 22px; }
  .status .es.pulse { background: rgba(255,255,255,.18); box-shadow: inset 0 0 0 2px #f5a524; }
  .tree { color: #bbb; font-size: 13px; line-height: 22px; }
  .tree .f { padding-left: 14px; color: var(--muted); }
  .caption { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 22px; color: #e6edf3; font-size: 18px; }
  .step { width: 34px; height: 34px; border-radius: 50%; background: #2f81f7; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 17px; flex-shrink: 0; }
  .caption small { color: #8b949e; font-size: 14px; margin-left: auto; }
  .kbd { border: 1px solid #555; border-bottom-width: 2px; border-radius: 4px; padding: 0 6px; font-size: 14px; color: #ddd; margin: 0 2px; }
  .cursor { position: absolute; z-index: 9; pointer-events: none; }
</style>
</head>
<body>
<div class="win">
  <div class="title"><span class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></span><span id="title">Visual Studio Code</span></div>
  <div class="main">
    <div class="activity">
      <div class="ab" id="ab-files"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3H6v18h12V7z M14 3v4h4"/></svg></div>
      <div class="ab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></div>
      <div class="ab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="9" r="2"/><path d="M6 8v8M18 11c0 4-6 3-10 6"/></svg></div>
      <div class="ab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 4l12 8-12 8z"/></svg></div>
      <div class="ab" id="ab-ext"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="7" height="7"/><rect x="11" y="11" width="7" height="7"/><rect x="3" y="4" width="7" height="7"/><rect x="13.5" y="2.5" width="7" height="7" transform="rotate(10 17 6)"/></svg></div>
    </div>
    <div class="sidebar" id="sidebar"></div>
    <div class="editor" id="editor"><div class="logo">⌘</div></div>
  </div>
  <div class="status"><span>⎇ main</span><span>⊗ 0 ⚠ 0</span><span class="es" id="es"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.3"><rect x="4" y="4" width="8" height="8" rx="1"/><path d="M6 1v3M10 1v3M6 12v3M10 12v3M1 6h3M1 10h3M12 6h3M12 10h3"/></svg>Embedded Studio</span></div>
</div>
<div class="caption"><span class="step" id="num">1</span><span id="cap"></span><small>temsili çizim</small></div>
<svg class="cursor" id="cursor" width="22" height="22" viewBox="0 0 22 22"><path d="M3 2l14 8-6 1.6L8 18z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
<script>
  const q = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  const adim = Number(q.adim || 1), yaz = q.yaz || '', kurulu = q.kurulu === '1', imlec = (q.imlec || '').split(',').map(Number);
  const $ = (id) => document.getElementById(id);
  const caps = {
    1: 'Uzantılar panelini açın <span class="kbd">Ctrl</span>+<span class="kbd">Shift</span>+<span class="kbd">X</span>',
    2: '<b>Embedded Studio</b> diye arayın',
    3: kurulu ? 'Kuruldu! Artık kullanıma hazır.' : '<b>Install</b> (Yükle) düğmesine tıklayın',
    4: 'Bir klasör açın ve durum çubuğundaki <b>Embedded Studio</b>\'ya tıklayın',
    5: 'Sihirbazla projenizi oluşturun: HAL / bare-metal, FreeRTOS'
  };
  $('num').textContent = adim;
  $('cap').innerHTML = caps[adim];
  const ext = (state) => `<div class="ext sel"><img src="../../media/icon.png" alt=""><div><b>Embedded Studio</b><span class="badge">Preview</span><div class="pub">mhmtakfseckin</div><div class="desc">STM32 için görsel gömülü sistem tasarımı: pin/saat ataması, HAL + FreeRTOS kod üretimi…</div><span class="install ${state}">${state === 'done' ? 'Uninstall · ⚙' : 'Install'}</span></div></div>`;
  if (adim === 1) {
    $('ab-ext').classList.add('pulse');
    $('sidebar').innerHTML = '<div class="sb-title">Explorer</div><div class="tree">▸ Açık editör yok</div>';
  } else if (adim <= 3) {
    $('ab-ext').classList.add('on');
    $('sidebar').innerHTML = `<div class="sb-title">Extensions: Marketplace</div><div class="search ${adim === 2 ? 'focus' : ''}">${yaz || '<span style="color:#888">Search Extensions in Marketplace</span>'}${adim === 2 ? '<span class="caret"></span>' : ''}</div>` +
      (yaz.length >= 4 || adim === 3 ? ext(adim === 3 && kurulu ? 'done' : adim === 3 ? 'pulse' : '') : '');
  } else {
    $('ab-files').classList.add('on');
    $('sidebar').innerHTML = '<div class="sb-title">Explorer</div><div class="tree">▾ BENIM_PROJEM<div class="f">(boş klasör)</div></div>';
    if (adim === 4) $('es').classList.add('pulse');
    if (adim === 5) {
      $('title').textContent = 'Embedded Studio — Visual Studio Code';
      $('editor').innerHTML = '<img class="shot" src="../../docs/images/sihirbaz.png" alt="">';
    }
  }
  if (imlec.length === 2 && !Number.isNaN(imlec[0])) { $('cursor').style.left = imlec[0] + 'px'; $('cursor').style.top = imlec[1] + 'px'; } else $('cursor').style.display = 'none';
</script>
</body>
</html>
